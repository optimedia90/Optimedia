<!doctype html>
<html lang="en">
  <head>
    <script>
      // Restore the requested SPA route after a static host's 404 fallback.
      (function () {
        const params = new URLSearchParams(window.location.search);
        const requestedPath = params.get("__spa_path");
        if (requestedPath && requestedPath.startsWith("/")) {
          window.history.replaceState(null, "", requestedPath);
        }
      })();
    </script>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/public/optimedia_logo.jpeg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Optimedia Solutions</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
